name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build installers
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: huburt-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos-package:
    name: macOS download (zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build and package
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: huburt-macos
          path: dist/*.zip
          if-no-files-found: error

  # AI code review of every pull request, requested only once the build and tests above have passed, so a review is of
  # code that builds. Authentication is GitHub's built-in OIDC token (no secret), but two things must be set up once outside
  # this file or the job warns and does nothing: the CodePulse GitHub App installed on this account or repository, and
  # "GitHub Action trigger" enabled in the CodePulse dashboard (Settings -> Triggers).
  codepulse:
    name: CodePulse review
    needs: [test, windows-installer, macos-package]
    # Only for pull requests from this repository: GitHub gives `id-token: write` to no one else, so the action would fail
    # on a fork's pull request with a red check the contributor can't fix.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # the only permission it needs: a short-lived token to prove the request comes from this repository
    # Only the newest commit on a branch is worth reviewing
    concurrency:
      group: codepulse-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Pinned to an immutable commit rather than the mutable `v1` tag: this job can mint an OIDC token in this repository's
      # name, and a tag can be repointed. This is what v1 resolved to (release v1.0.4); to update, read the diff, then
      # change the SHA and the version comment together.
      - uses: codepulsehq/review-action@4b874cbef6665a3c74baa015962d5ab60bf6d082 # v1.0.4
