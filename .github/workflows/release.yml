name: Release

# Push a tag like v0.1.1 to build the Windows installers and the macOS download and attach them to a GitHub release.
# The tag must match the version in src-tauri/tauri.conf.json. Run it by hand (Actions tab) to rebuild an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach to (for example v0.1.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG doesn't match the app version $version"; exit 1; }
      - name: Create the release if it doesn't exist
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          flag=""; case "$TAG" in v0.*) flag="--prerelease";; esac
          gh release create "$TAG" --title "Huburt ${TAG#v}" --generate-notes $flag

  windows:
    name: Windows installers
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build installers
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis,msi
      - name: Attach to the release
        shell: bash
        run: gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi --clobber

  macos:
    name: macOS download
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build and package
        run: ./scripts/package-macos.sh
      - name: Attach to the release
        run: gh release upload "$TAG" dist/*.zip --clobber

  checksums:
    name: Checksums
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Publish SHA-256 checksums for every download
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --pattern '*.msi' --pattern '*.zip'
          sha256sum *.exe *.msi *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" SHA256SUMS.txt --clobber
