name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste message text, tokens or cookies. The log file contains counts and status only,
        so it is safe to attach.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows 11, Windows 10, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you installed, or the commit you built.
  - type: dropdown
    id: service
    attributes:
      label: Which service?
      options: [Slack, Gmail, WhatsApp, All or none]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: "macOS: ~/Library/Logs/Huburt.log. Windows: %LOCALAPPDATA%\\Huburt\\Huburt.log. The last 30 lines are plenty."
      render: text
